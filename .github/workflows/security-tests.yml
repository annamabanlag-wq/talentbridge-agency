name: TalentBridge Security Tests

on:
  push:
    branches: [main, security-hardening]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run API and frontend security regression tests
        run: node --test
